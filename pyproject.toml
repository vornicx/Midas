[project]
name = "midas-memory"
version = "0.1.1"
description = "Local-first, eval-first memory for long-horizon AI agents — no LLM at ingest"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
keywords = ["agent", "memory", "llm", "rag", "mcp", "embeddings", "long-horizon"]
# Core runs with ZERO third-party deps (stdlib only) so it installs instantly and works offline.
dependencies = []

# Optional extras — install what you need (or `[all]` for everything):
#   all       -> local embeddings + MCP server + LangGraph (the recommended one-shot install)
#   local     -> local semantic embeddings (fastembed/ONNX — no API key, no torch)
#   turbovec  -> compressed (2/4-bit) vector store + exact rerank — long-horizon memory at ~1/15 the RAM
#   model2vec -> static (distilled) embeddings — an ultra-fast CPU speed tier
#   mcp       -> expose Midas as an MCP server (`midas-mcp` / `python -m midas.mcp_server`)
#   langgraph -> use Midas as a LangGraph BaseStore (long-term memory)
#   openai    -> OpenAI embeddings + LLM-judge   ·   dev -> tests + exact token counts
[project.optional-dependencies]
all = ["fastembed>=0.7", "turbovec>=0.8", "model2vec>=0.8", "mcp>=1.0", "langgraph>=0.2"]
local = ["fastembed>=0.7"]
turbovec = ["turbovec>=0.8"]
model2vec = ["model2vec>=0.8"]
mcp = ["mcp>=1.0"]
langgraph = ["langgraph>=0.2"]
openai = ["openai>=1.0"]
dev = ["pytest>=8", "tiktoken"]

[project.urls]
Homepage = "https://github.com/vornicx/Midas"
Repository = "https://github.com/vornicx/Midas"

[project.scripts]
midas = "midas.cli:main"
midas-mcp = "midas.mcp_server:main"
midas-inspect = "midas.inspector:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# `midas` is the shippable SDK; `eval/` is dev-only tooling and stays out of the wheel.
[tool.hatch.build.targets.wheel]
packages = ["midas"]

[tool.ruff]
line-length = 100
target-version = "py311"
