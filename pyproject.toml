[project]
name = "origin-lab"
version = "0.0.1"
description = "Midas — agentic memory wedge + eval harness (working name)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# Core runs with ZERO third-party deps (stdlib only) so the harness works offline.
dependencies = []

# Optional extras, installed on demand (e.g. `uv pip install openai`):
#   openai      -> real semantic embeddings + LLM-judge
#   tiktoken    -> exact token counts (replaces the ~1.3/word estimate)
#   mem0ai / zep-cloud / letta-client -> competitor adapters (wire up later)
[project.optional-dependencies]
openai = ["openai>=1.0"]
local = ["fastembed>=0.7"]  # local semantic embeddings (ONNX, no API key, no torch)
mcp = ["mcp>=1.0"]          # expose Midas as an MCP server (python -m midas.mcp_server)
langgraph = ["langgraph>=0.2"]  # use Midas as a LangGraph BaseStore (long-term memory)
dev = ["pytest>=8", "tiktoken"]

[project.scripts]
midas-mcp = "midas.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# `midas` is the shippable SDK; `eval/` is dev-only tooling and stays out of the wheel.
[tool.hatch.build.targets.wheel]
packages = ["midas"]

[tool.ruff]
line-length = 100
target-version = "py311"
