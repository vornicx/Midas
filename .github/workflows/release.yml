name: Release

# Tag a release and this publishes it everywhere:
#   git tag vX.Y.Z && git push origin vX.Y.Z
# PyPI uses trusted publishing (OIDC — no token). npm uses the NPM_TOKEN repo secret.
# Both steps are idempotent: a version already on the registry is skipped, not failed.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write # PyPI trusted publishing (OIDC) — configure the trusted publisher on PyPI once
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  npm:
    name: Publish the TS port to npm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/midas-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build
      - name: Publish if the version is new
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "midas-memory-mcp@$V" version >/dev/null 2>&1; then
            echo "midas-memory-mcp@$V is already on npm — skipping"
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
